version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Clearing old dependencies..."
      - rm -rf node_modules package-lock.json
      - echo "Installing dependencies..."
      - npm install --legacy-peer-deps
  build:
    commands:
      - echo "Running build..."
      - npm run build
artifacts:
  files:
    - '**/*'
  base-directory: build
